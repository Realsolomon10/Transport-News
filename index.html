<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lille Live Bus Departures | Transport News</title>
    <meta name="description" content="Live departure times for the Ilevia bus network in Lille, France. Stay updated with real-time transport news.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <main class="container">
        <header>
            <div class="header-content">
                <h1>Lille <span class="highlight">Transit Live</span></h1>
                <p>Real-time Bus Departures</p>
            </div>
            <div class="time-display" id="current-time">
                --:--:--
            </div>
        </header>

        <section class="news-ticker">
            <div class="ticker-content">
                <span class="ticker-label">NEWS:</span>
                <marquee behavior="scroll" direction="left" id="news-text">
                    Liane 5: Expect 5 minute delays due to heavy traffic on Boulevard Carnot. • Line 14: Diversion in place near République Beaux-Arts starting 14:00. • CITL running smoothly.
                </marquee>
            </div>
        </section>

        <section class="bus-grid" id="bus-grid">
            <!-- Bus cards will be injected here by JS -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
